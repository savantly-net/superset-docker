[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "franops-bi"
version = "0.1.0"
description = "Deploy certified Superset assets from a brand repository's bi/ folder."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
franops-bi = "franops_bi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["rig: needs the live rig (rig/rig.sh up); deselected unless FRANOPS_BI_RIG=1"]

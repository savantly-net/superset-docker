# OAuth mode for rig-superset (S5.6): the OAuth values of scripts/deployed-shape.env. The
# provider is never called; compose.oidc.yml adds a fake one for the S5.2 login check. With
# OAuth on, the API login with the `db` provider accepts the service account only (S5.8), so
# the admin cannot log in through the API.
# Usage: RIG_OAUTH=1 rig/rig.sh restart
services:
  rig-superset:
    environment:
      OAUTH_ENABLED: "true"
      OAUTH_ISSUER: https://issuer.invalid
      OAUTH_NAME: oidc
      OAUTH_CLIENT_ID: check-client
      OAUTH_CLIENT_SECRET: check-client-secret
      EMBED_ORIGINS: https://portal.invalid

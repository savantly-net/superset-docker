name: Build and push Docker image

# Pull requests and pushes to main only BUILD (a compile check for the Dockerfile and config).
# Publishing is a manual, deliberate act: run the workflow with the base tag to publish.
# Version tags are treated as immutable and `latest` moves only when asked, so a merge can
# never overwrite the tag production is running.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_tag:
        description: "apache/superset base image tag to build from; also the published version tag (e.g. 6.1.0)"
        required: true
        type: string
      push_latest:
        description: "Also move savantly/superset:latest to this build (only after the version is proven in prod)"
        required: false
        type: boolean
        default: false

env:
  IMAGE_NAME: savantly/superset

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Playwright deps + chromium install make the first (uncached) build slow
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve base tag
        id: tag
        # Manual runs choose the tag; build-only runs use the Dockerfile default so PRs test what they change.
        run: |
          if [ -n "${{ github.event.inputs.base_tag }}" ]; then
            tag="${{ github.event.inputs.base_tag }}"
          else
            tag=$(sed -nE 's/^FROM apache\/superset:\$\{BASE_TAG:-([^}]+)\}.*/\1/p' Dockerfile)
          fi
          echo "base_tag=$tag" >> "$GITHUB_OUTPUT"
          tags="${IMAGE_NAME}:${tag}"
          if [ "${{ github.event.inputs.push_latest }}" = "true" ]; then tags="${tags},${IMAGE_NAME}:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Building from apache/superset:$tag -> $tags"

      - name: Refuse to overwrite a published version tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if docker manifest inspect "${IMAGE_NAME}:${{ steps.tag.outputs.base_tag }}" >/dev/null 2>&1; then
            echo "::error::${IMAGE_NAME}:${{ steps.tag.outputs.base_tag }} already exists on Docker Hub; version tags are immutable. Delete it there first if a rebuild is really intended."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            BASE_TAG=${{ steps.tag.outputs.base_tag }}
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.tag.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "Published \`${IMAGE_NAME}:${{ steps.tag.outputs.base_tag }}\`"
            echo ""
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- latest moved: ${{ github.event.inputs.push_latest }}"
          } >> "$GITHUB_STEP_SUMMARY"

name: Build and push Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_tag:
        description: "apache/superset base image tag to build from"
        required: false
        default: "5.0.0"

env:
  IMAGE_NAME: savantly/superset
  # Superset base tag; also becomes the image version tag (matches BASE_TAG in deploy.sh)
  BASE_TAG: ${{ github.event.inputs.base_tag || '5.0.0' }}

permissions:
  contents: read

# Avoid two pushes to main racing on :latest
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Playwright deps + chromium install make the first (uncached) build slow
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            BASE_TAG=${{ env.BASE_TAG }}
          # PRs only build; pushes to main and manual runs publish
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.BASE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

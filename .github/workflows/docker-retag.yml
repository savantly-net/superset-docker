name: Retag Docker image

# Re-points one or more tags at an existing image by digest, without rebuilding or downloading it.
# The image bytes and digest do not change. Use it to restore a tag, or to move `latest` to a version
# that has been proven in production. This touches Docker Hub only; nothing in the clusters changes.
on:
  workflow_dispatch:
    inputs:
      source_digest:
        description: "Digest of the existing image to point the tags at (sha256:...)"
        required: true
        type: string
      tags:
        description: "Comma-separated tags to (re)point, e.g. 5.0.0,latest"
        required: true
        type: string
      confirm_overwrite:
        description: "Tick to allow moving tags that already exist (required for a restore)"
        required: false
        type: boolean
        default: false

env:
  IMAGE_NAME: savantly/superset
  CRANE_VERSION: v0.22.1

permissions:
  contents: read

jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install crane
        run: |
          curl -sSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          crane version

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify the source image exists
        run: |
          src="${IMAGE_NAME}@${{ inputs.source_digest }}"
          echo "source: $src"
          crane manifest "$src" | head -c 600; echo
          crane config "$src" | jq -r '"created: \(.created)  arch: \(.architecture)"'

      - name: Retag
        run: |
          src="${IMAGE_NAME}@${{ inputs.source_digest }}"
          IFS=',' read -ra TAGS <<< "${{ inputs.tags }}"
          for t in "${TAGS[@]}"; do
            t="$(echo "$t" | xargs)"; [ -z "$t" ] && continue
            if current=$(crane digest "${IMAGE_NAME}:${t}" 2>/dev/null); then
              if [ "$current" = "${{ inputs.source_digest }}" ]; then echo "${t}: already points at the source, nothing to do"; continue; fi
              if [ "${{ inputs.confirm_overwrite }}" != "true" ]; then
                echo "::error::${IMAGE_NAME}:${t} exists (${current}) and confirm_overwrite is not set"; exit 1
              fi
              echo "${t}: moving from ${current}"
            else
              echo "${t}: new tag"
            fi
            crane tag "$src" "$t"
            after=$(crane digest "${IMAGE_NAME}:${t}")
            if [ "$after" != "${{ inputs.source_digest }}" ]; then echo "::error::${t} resolves to ${after}, expected ${{ inputs.source_digest }}"; exit 1; fi
            echo "${t} -> ${after}"
            echo "- \`${IMAGE_NAME}:${t}\` → \`${after}\`" >> "$GITHUB_STEP_SUMMARY"
          done
